# CI for DonorConnect AI Premium. No deployment, no production credentials, no paid services, fictional data only.
#
# Job layout (docs/CI.md):
#   unit            pure unit tests + lint + typecheck + secret scan. NO services, NO .env files.
#   build           production build with public, non-secret placeholders (never contacts Supabase).
#   integration     starts the local Supabase-compatible stack (Docker Compose), waits until every service is HEALTHY, then runs the
#                   service-backed Vitest suites (REQUIRE_SERVICES=1: a missing service FAILS, nothing is skipped) and the Playwright suite.
#   fresh-database  all migrations on a brand-new isolated database + DB tests (strict).
#   dependencies    `npm audit --omit=dev` (always on) + GitHub dependency-review (only where the repository supports it; reported loudly, see docs/CI.md).
#   ci-gate         single required check: fails unless every job above succeeded. A skipped or cancelled job is a failure.
# Secrets: none are required. GEMINI_API_KEY is never available to these jobs (all AI tests use the double-gated mock; live Gemini is manual).
name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  unit:
    name: Lint, typecheck, unit tests, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit        # vitest.unit.config.ts: no database, no network, no .env
      - run: npm run scan:secrets

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:   # public, non-secret placeholders so `next build` works without a Supabase project (the build never contacts it)
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  integration:
    name: Isolated stack, DB tests and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: npx playwright install --with-deps chromium
      - name: Start the local Supabase-compatible stack (Docker Compose, generated throwaway credentials, written to git-ignored files)
        run: node scripts/stack.mjs up
      - name: Wait until PostgreSQL, GoTrue, PostgREST, Realtime and Mailpit are healthy (fails after 3 minutes)
        run: node scripts/stack-health.mjs 180
      - name: Seed fictional demo accounts
        run: npm run db:seed
      - name: Service-backed Vitest suites (RLS, workflow, realtime WebSocket, email, API, analytics, hardening)
        run: npm run test:db
        env: { REQUIRE_SERVICES: "1" }
      - name: Playwright (desktop + mobile) - journeys, analytics, axe, keyboard, PWA, responsive
        run: |
          set -o pipefail
          npm run test:e2e -- --trace off 2>&1 | tee playwright.log     # full output kept for the artifact; no retries (a flaky test must stay visible)
        env: { REQUIRE_SERVICES: "1" }
      - name: Container status and logs on failure (service logs only; no environment is printed)
        if: failure()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}'
          for c in $(docker ps -a --format '{{.Names}}'); do echo "::group::$c"; docker logs --tail 25 "$c" 2>&1 | cut -c1-300 | sed -E 's/(eyJ[A-Za-z0-9_-]{10,})/<jwt>/g'; echo "::endgroup::"; done
      - name: Stop the stack
        if: always()
        run: node scripts/stack.mjs down
      - name: Playwright failure summary (printed last so it is the end of the job log)
        if: failure()
        run: |
          echo "=== totals ==="; grep -E "^\s+[0-9]+ (passed|failed|skipped|flaky|did not run)" playwright.log || echo "(no Playwright totals: the run did not finish)"
          echo "=== failed tests ==="; grep -E "^\s+[0-9]+\) \[" playwright.log | sort -u | head -40 || true
          echo "=== first errors ==="; grep -E -A7 "^\s+[0-9]+\) \[" playwright.log | cut -c1-260 | head -90 || true
      - name: Upload failure report (Playwright output + results; fictional data, no traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: "test-results\nplaywright.log", retention-days: 7, if-no-files-found: ignore }

  fresh-database:
    name: Fresh-database verification (all migrations on an empty database)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: npm run verify:fresh      # isolated compose project + volume; strict (REQUIRE_SERVICES=1 is set inside the script)

  dependencies:
    name: Dependency and security review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Fail on high/critical vulnerabilities in production dependencies (always on)
        run: npm audit --omit=dev --audit-level=high
      - name: Informational full audit (dev tooling; major-version fixes are reviewed by hand, never auto-applied)
        run: npm audit || true
      - name: Probe whether GitHub dependency review is available for this repository (pull requests only)
        id: depreview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The action needs the dependency graph (and GitHub Advanced Security on private repositories). Ask the same API it uses.
          # 200 -> run the action. 403/404 -> the FEATURE is unavailable: report it loudly and skip only the action. Anything else -> fail (unknown state).
          code=$({ gh api -i "repos/${REPO}/dependency-graph/compare/${BASE}...${HEAD}" 2>/dev/null || true; } | head -n1 | awk '{print $2}')   # `|| true`: a 4xx must be classified below, not abort the step under -e/pipefail
          echo "dependency-graph compare API answered HTTP ${code:-none}"
          case "$code" in
            200) echo "available=true" >> "$GITHUB_OUTPUT" ;;
            403|404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Dependency review NOT RUN::The dependency-review API is unavailable for this repository (HTTP ${code}). It needs the dependency graph plus GitHub Advanced Security (private repositories) or a public repository. The production npm audit above still ran. See docs/CI.md."
              { echo "### Dependency review: NOT RUN"; echo; echo "GitHub's dependency-review API answered **HTTP ${code}**: the feature is not available for this repository."; echo "The production \`npm audit\` gate above still ran and passed. See docs/CI.md to enable it."; } >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::Could not determine whether dependency review is available (HTTP ${code:-none}). Failing rather than skipping silently."; exit 1 ;;
          esac
      - name: Review dependency changes in pull requests (runs only where the feature is confirmed available)
        if: github.event_name == 'pull_request' && steps.depreview.outputs.available == 'true'
        uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }

  ci-gate:
    name: CI gate (all required jobs)
    runs-on: ubuntu-latest
    if: always()
    needs: [unit, build, integration, fresh-database, dependencies]
    steps:
      - name: Require every job to have succeeded (skipped or cancelled counts as failure)
        env: { RESULTS: "${{ join(needs.*.result, ' ') }}", DETAIL: "${{ toJSON(needs) }}" }
        run: |
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do [ "$r" = "success" ] || { echo "::error::At least one required job did not succeed."; exit 1; }; done
          echo "all required jobs succeeded"
