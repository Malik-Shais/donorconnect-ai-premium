server {
  listen 8000;
  location /auth/v1/ { proxy_pass http://auth:9999/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  # Supabase Realtime (WebSocket). The tenant is chosen from the Host's first label.
  location /realtime/v1/ {
    proxy_pass http://realtime:4000/socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host realtime-dev.localhost;
    proxy_read_timeout 3600s;
  }
  location /rest/v1/ { proxy_pass http://rest:3000/; proxy_set_header Host $host; }
}
